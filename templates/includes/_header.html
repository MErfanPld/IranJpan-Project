{% load static i18n %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="keywords" content="{% block meta_keywords %}{% trans 'اتاق بازرگانی ایران و ژاپن, تجارت ایران ژاپن, Iran Japan Chamber of Commerce, イラン日本商工会議所' %}{% endblock %}">
<meta name="description" content="{% block meta_description %}{% trans 'وب‌سایت رسمی اتاق بازرگانی مشترک ایران و ژاپن' %}{% endblock %}">
<meta name="author" content="Iran-Japan Chamber of Commerce">

{# Language & direction aware CSS #}
{% if LANGUAGE_BIDI %}
    <link rel="stylesheet" href="{% static 'css/bootstrap.rtl.min.css' %}">
{% else %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
{% endif %}

<link rel="stylesheet" href="{% static 'css/animate.min.css' %}">
<link rel="stylesheet" href="{% static 'css/meanmenu.css' %}">
<link rel="stylesheet" href="{% static 'css/boxicons.min.css' %}">
<link rel="stylesheet" href="{% static 'css/owl.carousel.min.css' %}">
<link rel="stylesheet" href="{% static 'css/owl.theme.default.min.css' %}">
<link rel="stylesheet" href="{% static 'css/magnific-popup.min.css' %}">
<link rel="stylesheet" href="{% static 'css/nice-select.min.css' %}">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/dark.css' %}">
<link rel="stylesheet" href="{% static 'css/responsive.css' %}">

{% if LANGUAGE_BIDI %}
    <link rel="stylesheet" href="{% static 'css/rtl.css' %}">
    <link rel="stylesheet" href="{% static 'css/Vazirmatn-RD-FD-font-face.css' %}">
{% endif %}

{# Japanese typography support #}
{% if LANGUAGE_CODE == 'ja' %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body, h1, h2, h3, h4, h5, h6, p, li, a, button, input, textarea, select {
            font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif !important;
            letter-spacing: 0.02em;
        }
    </style>
{% elif not LANGUAGE_BIDI %}
    {# English / LTR fallback #}
    <style>
        body, h1, h2, h3, h4, h5, h6, p, li, a, button, input, textarea, select {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
        }
    </style>
{% endif %}
